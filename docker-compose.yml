version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: careeros_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: careeros_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careeros_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careeros_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeros_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:secure_postgres_password@db:5432/careeros_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_jwt_sign_key_rotating_32_bytes_len
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeros_worker
    command: celery -A app.workers.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:secure_postgres_password@db:5432/careeros_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_jwt_sign_key_rotating_32_bytes_len
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careeros_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
